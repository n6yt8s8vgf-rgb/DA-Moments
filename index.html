/* =========================
   GRUNDFARBEN
========================= */

:root{
--cream:#f6f2eb;
--paper:#fffdf9;
--green:#46564a;
--deep:#2f3d34;
--eucalyptus:#778779;
--sage:#dce2d8;
--champagne:#b9a47e;
--lavender:#8d6a8f;
--lavender-light:#a186a8;
--ink:#29332c;
--muted:#667168;
--line:rgba(70,86,74,.18);
--shadow:0 16px 40px rgba(47,61,52,.12);
--max:1160px;
}

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
background:var(--cream);
color:var(--ink);
font:16px/1.65 Arial,Helvetica,sans-serif;
}

img{
display:block;
max-width:100%;
}

a{
color:inherit;
}

.wrap{
width:min(var(--max),calc(100% - 40px));
margin:auto;
}


/* =========================
   NAVIGATION
========================= */

.top{
position:sticky;
top:0;
z-index:50;

background:rgba(246,242,235,.96);

border-bottom:1px solid var(--line);

backdrop-filter:blur(12px);
}

nav{
min-height:74px;

display:flex;
align-items:center;
justify-content:space-between;

gap:20px;
}

.brand{
text-decoration:none;

color:var(--deep);

font:700 1.45rem Georgia,serif;

letter-spacing:.07em;
}

.brand span{
display:block;

color:var(--lavender);

font:700 .68rem Arial,sans-serif;

letter-spacing:.24em;
}

.links{
display:flex;

gap:20px;

margin:0;
padding:0;

list-style:none;
}

.links a{
text-decoration:none;

font-size:.9rem;
font-weight:700;
}

.links a:hover{
color:var(--lavender);
}


/* =========================
   BUTTONS
========================= */

.btn{
display:inline-flex;

align-items:center;
justify-content:center;

min-height:48px;

padding:10px 22px;

border:1px solid var(--deep);

border-radius:999px;

background:var(--deep);

color:white;

text-decoration:none;

font-weight:700;

transition:.2s;
}

.btn:hover{
background:var(--green);
transform:translateY(-2px);
}

.btn.outline{
background:transparent;
color:var(--deep);
}


/* =========================
   TYPOGRAFIE
========================= */

h1,
h2,
h3{
margin-top:0;

font-family:Georgia,"Times New Roman",serif;

color:var(--deep);

line-height:1.12;
}

.eyebrow{
color:var(--lavender);

font-size:.76rem;
font-weight:800;

letter-spacing:.16em;

text-transform:uppercase;
}

   HERO
========================= */

radial-gradient(
circle at 85% 25%,
rgba(185,164,126,.27),
transparent 32%
),

130deg,
var(--paper),
var(--cream)
);
}

.hero-grid{
display:grid;

grid-template-columns:1.05fr .95fr;

align-items:center;

gap:50px;
}

h1{
margin:15px 0;

font-size:clamp(2.8rem,6vw,5rem);

font-weight:500;
}

h1 em{
display:block;

color:var(--lavender);

font-weight:400;
}
